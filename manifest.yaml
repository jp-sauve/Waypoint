name: waypoint
version: 0.7.0
description: >-
  A reusable starting point for AI-assisted projects: requirements gathering for a
  new project or codebase inspection for an existing one, project planning, an
  engineering checklist, verified UI component and layout pattern references, and an
  implementer protocol, installable into Claude Code, GitHub Copilot, and/or Augure.

platforms:
  claude:
    displayName: Claude Code
    globalInstallSupported: true
    # Root that dist/claude/global/** installPaths (e.g. "skills/start-project")
    # are resolved against — NOT ~/.claude/skills, since installPath already includes
    # the "skills/" segment (matches how project-scope installPaths already include
    # their own ".claude/" prefix, e.g. ".claude/skills/web-engineering-checklist").
    globalInstallRoot: "~/.claude"
  copilot:
    displayName: GitHub Copilot
    globalInstallSupported: false
  augure:
    displayName: Augure
    globalInstallSupported: true
    globalInstallRoot: "~/.augure"

# Tokens used in methodology/**.md and commands/**.md bodies, resolved per platform
# at build time by adapters/lib/template.ts. Every token must have an entry here for
# every platform — the build fails otherwise (see tests/build.test.ts).
tokens:
  "artifact:start-project":
    claude: "the `start-project` Skill"
    copilot: "`.github/prompts/start-project.prompt.md`"
    augure: "the `start-project` Skill"
  "artifact:extend-project":
    claude: "the `extend-project` Skill"
    copilot: "`.github/prompts/extend-project.prompt.md`"
    augure: "the `extend-project` Skill"
  "artifact:project-planning":
    claude: "the `project-planner` Skill"
    copilot: "`.github/prompts/project-planner.prompt.md`"
    augure: "the `project-planner` Skill"
  "artifact:engineering-checklist":
    claude: "the `web-engineering-checklist` Skill"
    copilot: "the checklist references at `.waypoint/checklist/references/` (`owasp-top10.md`, `wcag-checklist.md`, `privacy-checklist.md`)"
    augure: "the `web-engineering-checklist` Skill"
  "artifact:ui-components":
    claude: "the `ui-component-references` Skill"
    copilot: "the UI component references at `.waypoint/ui-components/references/`"
    augure: "the `ui-component-references` Skill"
  "artifact:layout-patterns":
    claude: "the `layout-pattern-references` Skill"
    copilot: "the layout pattern references at `.waypoint/layout-patterns/references/`"
    augure: "the `layout-pattern-references` Skill"
  "artifact:game-engineering-checklist":
    claude: "the `game-engineering-checklist` Skill"
    copilot: "the game engineering references at `.waypoint/game-engineering/references/`"
    augure: "the `game-engineering-checklist` Skill"
  "command:next-step":
    claude: "`/next-step`"
    copilot: "`.github/prompts/next-step.prompt.md`"
    augure: "`/next-step`"
  "command:review-step":
    claude: "`/review-step`"
    copilot: "`.github/prompts/review-step.prompt.md`"
    augure: "`/review-step`"
  "command:small-change":
    claude: "`/small-change`"
    copilot: "`.github/prompts/small-change.prompt.md`"
    augure: "`/small-change`"

artifacts:
  - id: start-project
    kind: skill
    name: start-project
    description: >-
      Interviews the user to gather requirements for a new website before any design
      or code work begins.
    source: methodology/start-project.md
    installScope: global
    platforms:
      claude:
        type: skill
        installPath: "skills/start-project"
      copilot:
        type: prompt
        installPath: ".github/prompts/start-project.prompt.md"
      augure:
        type: skill
        installPath: "skills/start-project"

  - id: extend-project
    kind: skill
    name: extend-project
    description: >-
      Inspects an existing project's codebase — stack, architecture, conventions,
      extension points — and writes project-context.md so a new feature or subsystem
      can be planned against what's actually there instead of assumed from scratch.
    source: methodology/extend-project.md
    installScope: global
    platforms:
      claude:
        type: skill
        installPath: "skills/extend-project"
      copilot:
        type: prompt
        installPath: ".github/prompts/extend-project.prompt.md"
      augure:
        type: skill
        installPath: "skills/extend-project"

  - id: project-planning
    kind: skill
    name: project-planner
    description: >-
      Generate a complete docs/design/ planning package for a new software project
      before implementation begins.
    source: methodology/project-planning.md
    bundledFiles:
      - methodology/project-planning/templates/step-format.md
      - methodology/project-planning/templates/status-template.md
      - methodology/project-planning/templates/review-checklist.md
    installScope: global
    platforms:
      claude:
        type: skill
        installPath: "skills/project-planner"
        bundledFilesInstallPath: "skills/project-planner/templates"
      copilot:
        type: prompt
        installPath: ".github/prompts/project-planner.prompt.md"
        # per-project, not global (Copilot has no global mechanism) — see §11 risk 6
        # in docs/restructure-plan.md for why this is a shared neutral path rather than
        # a Claude-namespaced one.
        bundledFilesInstallPath: ".waypoint/planning-templates"
      augure:
        type: skill
        installPath: "skills/project-planner"
        bundledFilesInstallPath: "skills/project-planner/templates"

  - id: engineering-checklist
    kind: skill
    name: web-engineering-checklist
    description: >-
      Engineering standards checklist for Next.js + database web apps, covering
      security (OWASP), privacy (GDPR/CCPA), accessibility (WCAG), performance, and
      reliability.
    source: methodology/engineering-checklist.md
    bundledFiles:
      - methodology/engineering-checklist/references/owasp-top10.md
      - methodology/engineering-checklist/references/privacy-checklist.md
      - methodology/engineering-checklist/references/wcag-checklist.md
    installScope: project
    platforms:
      claude:
        type: skill
        installPath: ".claude/skills/web-engineering-checklist"
        # references live at the shared neutral path below, not bundled under the
        # skill folder, so Claude and Copilot read the exact same installed files.
        bundledFilesInstallPath: ".waypoint/checklist/references"
      copilot:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/checklist/references"
      augure:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/checklist/references"

  - id: ui-components
    kind: skill
    name: ui-component-references
    description: >-
      Verified, accessible reference implementations (modal, dropdown menu, toast,
      scroll-behavior header variants) for both React and vanilla HTML/CSS/JS projects,
      to adapt instead of reinventing focus management and keyboard handling from
      scratch.
    source: methodology/ui-components.md
    bundledFiles:
      - methodology/ui-components/references/modal.md
      - methodology/ui-components/references/modal-vanilla.md
      - methodology/ui-components/references/dropdown-menu.md
      - methodology/ui-components/references/dropdown-menu-vanilla.md
      - methodology/ui-components/references/toast.md
      - methodology/ui-components/references/toast-vanilla.md
      - methodology/ui-components/references/header-static.md
      - methodology/ui-components/references/header-fixed.md
      - methodology/ui-components/references/header-shrinking.md
    installScope: project
    platforms:
      claude:
        type: skill
        installPath: ".claude/skills/ui-component-references"
        # references live at the shared neutral path below, not bundled under the
        # skill folder, so Claude and Copilot read the exact same installed files.
        bundledFilesInstallPath: ".waypoint/ui-components/references"
      copilot:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/ui-components/references"
      augure:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/ui-components/references"

  - id: layout-patterns
    kind: skill
    name: layout-pattern-references
    description: >-
      Reference implementations of page-level layout architecture across two axes:
      page flow (document flow, hard/soft-snap and overlapping viewport sections,
      paged/slides, an SPA application shell, a sticky-panel scrolling narrative, a
      pan/zoom canvas, a progressively-loaded feed) and spatial composition
      (single/multi-column, grid variants incl. offset and masonry, a uniform flex
      row, bento, sidebar + content, layered, asymmetric), to adapt instead of
      reinventing scroll mechanics or layout structure from scratch.
    source: methodology/layout-patterns.md
    bundledFiles:
      - methodology/layout-patterns/references/document-flow.md
      - methodology/layout-patterns/references/viewport-sections-hard-snap.md
      - methodology/layout-patterns/references/viewport-sections-soft-snap.md
      - methodology/layout-patterns/references/viewport-sections-overlapping.md
      - methodology/layout-patterns/references/paged-slides.md
      - methodology/layout-patterns/references/spa-shell.md
      - methodology/layout-patterns/references/sticky-split-scroll.md
      - methodology/layout-patterns/references/canvas.md
      - methodology/layout-patterns/references/feed.md
      - methodology/layout-patterns/references/single-column.md
      - methodology/layout-patterns/references/multi-column.md
      - methodology/layout-patterns/references/grid-normal.md
      - methodology/layout-patterns/references/grid-offset.md
      - methodology/layout-patterns/references/grid-masonry.md
      - methodology/layout-patterns/references/uniform-flex-row.md
      - methodology/layout-patterns/references/bento.md
      - methodology/layout-patterns/references/sidebar-content.md
      - methodology/layout-patterns/references/layered.md
      - methodology/layout-patterns/references/asymmetric.md
    installScope: project
    platforms:
      claude:
        type: skill
        installPath: ".claude/skills/layout-pattern-references"
        # references live at the shared neutral path below, not bundled under the
        # skill folder, so Claude and Copilot read the exact same installed files.
        bundledFilesInstallPath: ".waypoint/layout-patterns/references"
      copilot:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/layout-patterns/references"
      augure:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/layout-patterns/references"

  - id: game-engineering-checklist
    kind: skill
    name: game-engineering-checklist
    description: >-
      Checklist and reference material for deterministic, interactive, networked
      games: keeping game rules in one authoritative rules engine, rules-review and
      adversarial testing, multiplayer server authority and synchronization, replay
      and simulation, and game-specific UX/playtesting. Self-selecting by diff — a
      non-game project's changes simply never match its trigger table.
    source: methodology/game-engineering-checklist.md
    bundledFiles:
      - methodology/game-engineering/references/deterministic-engine.md
      - methodology/game-engineering/references/multiplayer-authority.md
      - methodology/game-engineering/references/game-ux-playtest.md
    installScope: project
    platforms:
      claude:
        type: skill
        installPath: ".claude/skills/game-engineering-checklist"
        # references live at the shared neutral path below, not bundled under the
        # skill folder, so Claude and Copilot read the exact same installed files.
        bundledFilesInstallPath: ".waypoint/game-engineering/references"
      copilot:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/game-engineering/references"
      augure:
        type: references
        installPath: null
        bundledFilesInstallPath: ".waypoint/game-engineering/references"

  - id: implementer-instructions
    kind: instructions
    description: Always-on repo conventions and the STATUS.md implementer protocol.
    installScope: project
    platforms:
      claude:
        type: always-on
        installPath: "CLAUDE.md"
        includes: [core-protocol, stack-conventions, api-routes, react-components, tests]
      copilot:
        type: always-on
        installPath: ".github/copilot-instructions.md"
        includes: [core-protocol, stack-conventions]
      augure:
        type: always-on
        installPath: "AGENTS.md"
        includes: [core-protocol, stack-conventions, api-routes, react-components, tests]

  - id: api-routes-instructions
    kind: scoped-instructions
    source: methodology/implementer/api-routes.md
    applyTo: "**/api/**/*.ts,**/routes/**/*.ts,**/*.route.ts"
    installScope: project
    platforms:
      copilot:
        type: scoped
        installPath: ".github/instructions/api-routes.instructions.md"
      # claude: none — folded into CLAUDE.md via implementer-instructions above,
      # since Claude Code has no path-scoped auto-attach mechanism.

  - id: react-components-instructions
    kind: scoped-instructions
    source: methodology/implementer/react-components.md
    applyTo: "**/*.tsx"
    installScope: project
    platforms:
      copilot:
        type: scoped
        installPath: ".github/instructions/react-components.instructions.md"

  - id: tests-instructions
    kind: scoped-instructions
    source: methodology/implementer/tests.md
    applyTo: "**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx"
    installScope: project
    platforms:
      copilot:
        type: scoped
        installPath: ".github/instructions/tests.instructions.md"

  - id: next-step-command
    kind: command
    source: commands/next-step.md
    installScope: project
    platforms:
      claude:
        type: command
        installPath: ".claude/commands/next-step.md"
      copilot:
        type: prompt
        installPath: ".github/prompts/next-step.prompt.md"
      augure:
        type: command
        installPath: ".augure/commands/next-step.md"

  - id: review-step-command
    kind: command
    source: commands/review-step.md
    installScope: project
    platforms:
      claude:
        type: command
        installPath: ".claude/commands/review-step.md"
      copilot:
        type: prompt
        installPath: ".github/prompts/review-step.prompt.md"
      augure:
        type: command
        installPath: ".augure/commands/review-step.md"

  - id: small-change-command
    kind: command
    source: commands/small-change.md
    installScope: project
    platforms:
      claude:
        type: command
        installPath: ".claude/commands/small-change.md"
      copilot:
        type: prompt
        installPath: ".github/prompts/small-change.prompt.md"
      augure:
        type: command
        installPath: ".augure/commands/small-change.md"
